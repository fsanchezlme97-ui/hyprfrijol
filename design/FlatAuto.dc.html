<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Modo flat · color automático del fondo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; font-family: 'Inter', system-ui, sans-serif">
  <dc-import name="Main" view="escritorio" color-mode="auto" estilo="flat" bar-pos="abajo" bar-mode="fija" wallpaper="{{wallpaper}}" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"wallpaper":{"editor":"enum","options":["amanecer","lago","bruma"],"default":"lago"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { wallpaper: this.props.wallpaper ?? 'lago' }; }
}
</script>
</body>
</html>
