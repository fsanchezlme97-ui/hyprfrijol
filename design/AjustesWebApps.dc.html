<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ajustes · Web apps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 800px; font-family: 'Roboto Flex', system-ui, sans-serif">
  <dc-import name="Ajustes" seccion="webapps" palette="{{palette}}" hint-size="1280px,800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["grafito","pizarra","claro","lavanda","verde","ambar","azul"],"default":"pizarra"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return { palette: this.props.palette ?? 'pizarra' }; }
}
</script>
</body>
</html>
