source = ~/.local/state/hyprfrijol/hyprlock-colors.conf   # generado por matugen

general {
    hide_cursor = true
    grace = 2
}

background {
    path = ~/.local/state/hyprfrijol/current-wallpaper
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
}

label {
    text = cmd[update:30000] date +"%H:%M"
    font_size = 88
    font_family = Inter Light, Google Sans Flex, sans-serif
    color = $text
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A, %d de %B"
    font_size = 16
    font_family = Inter, Google Sans Flex, sans-serif
    color = $textMuted
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    size = 300, 44
    rounding = 8
    outline_thickness = 1
    outer_color = $outlineVariant
    inner_color = $fieldBg
    font_color = $text
    placeholder_text = Contraseña
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
