# cava para la onda de la barra: 48 bandas a 60 fps, poco suavizado (el suavizado fino lo hace Waveform.qml)
[general]
bars = 48
framerate = 60
autosens = 1
sensitivity = 110
lower_cutoff_freq = 40
higher_cutoff_freq = 14000

[input]
method = pipewire

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 18
monstercat = 0
waves = 0
