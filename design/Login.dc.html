<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio de sesión · greeter para cualquier distro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; font-family: 'Inter', system-ui, sans-serif">
  <dc-import name="Main" view="login" color-mode="{{colorMode}}" estilo="{{estilo}}" wallpaper="{{wallpaper}}" pip="false" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"wallpaper":{"editor":"enum","options":["amanecer","lago","bruma"],"default":"amanecer"},"colorMode":{"editor":"enum","options":["auto","mono"],"default":"auto"},"estilo":{"editor":"enum","options":["liquid","flat"],"default":"liquid"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { wallpaper: this.props.wallpaper ?? 'amanecer', colorMode: this.props.colorMode ?? 'auto', estilo: this.props.estilo ?? 'liquid' }; }
}
</script>
</body>
</html>
